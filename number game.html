<style>
.touch-me {
    width: 70px;
    height: 30px;
    font-size: 10px;
    position: absolute;
    top: 40px;
    left: 50%;
    background-color: rgb(75, 247, 7);
    border-radius: 20px;
    border: none;
    
}
.touch-me:hover {
      transform: translateY(-2px);  
    opacity: 0.1;
    


}

.touch:active{
background-color: rgb(235, 229, 229);
color: black;
}
</style>
